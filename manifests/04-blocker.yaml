# 實驗 4 第一步：先占住一張 A4500 的 blocker（bob 的工作，在 bob quota 內，不會被 alice 搶）
# <node-b> 換成其中一台 A4500 節點的名稱
apiVersion: v1
kind: Pod
metadata:
  name: blocker
  namespace: lab
  labels: {kai.scheduler/queue: bob, exp: exp4}
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  restartPolicy: Never
  nodeSelector: {kubernetes.io/hostname: <node-b>}
  containers:
  - name: main
    image: nvidia/cuda:12.8.1-base-ubuntu22.04
    command: ["sleep","3600"]
    resources:
      limits: {nvidia.com/gpu: 1}
