---
apiVersion: batch/v1
kind: Job
metadata:
  name: bob-job-1
  namespace: lab
  labels: {exp: exp3, owner: bob}
spec:
  backoffLimit: 0
  podFailurePolicy:
    rules:
    - action: Ignore            # 被 KAI 搶占（DisruptionTarget）不算失敗，Job 會重建 pod 重新排隊
      onPodConditions:
      - type: DisruptionTarget
  template:
    metadata:
      labels: {kai.scheduler/queue: bob, exp: exp3, owner: bob}
    spec:
      schedulerName: kai-scheduler
      runtimeClassName: nvidia
      restartPolicy: Never
      containers:
      - name: main
        image: nvidia/cuda:12.8.1-base-ubuntu22.04
        command: ["bash","-c","nvidia-smi --query-gpu=name --format=csv,noheader; sleep 3600"]
        resources:
          limits: {nvidia.com/gpu: 1}
